[package]
name = "dflow-scratchpad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A keyboard-first dictation scratchpad for Windows"

[[bin]]
name = "dflow"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6", default-features = false }
base64 = "0.22"
cpal = "0.17"
crossterm = "0.28"
hound = "3.5"
getrandom = "0.4"
rmcp = { version = "1", features = ["schemars", "transport-io"] }
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "socks"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml_edit = "0.22"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3"
