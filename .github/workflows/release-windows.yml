name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated version tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify version and assemble release notes
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $version = ($metadata | ConvertFrom-Json).packages[0].version
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match Cargo version v$version."
          }

          # Restore the original tag object so its annotation is available.
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git fetch --force --no-tags origin "${tagRef}:${tagRef}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the release tag.' }
          $tagCommit = git rev-parse "${tagRef}^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD)) {
            throw 'The release tag does not match the source that was built.'
          }

          $objectType = git cat-file -t $tagRef
          if ($LASTEXITCODE -ne 0 -or $objectType -cne 'tag') {
            throw 'The release requires an annotated tag containing the changelog.'
          }
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $lines = git for-each-ref '--format=%(contents)' $tagRef
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the tag annotation.' }
          $changelog = ($lines -join "`n").TrimEnd("`r", "`n")
          if ([string]::IsNullOrWhiteSpace($changelog)) { throw 'The changelog is empty.' }
          $quickStart = Get-Content -LiteralPath '.github/release-quickstart.md' -Raw -ErrorAction Stop
          $sections = @($changelog)
          if ($env:RELEASE_TAG -cnotin @('v0.3.0', 'v0.3.1')) {
            $sourceUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$tagCommit"
            $sections += & ./.github/release-doc-links.ps1 -Tag $env:RELEASE_TAG -SourceUrl $sourceUrl
          }
          $sections += $quickStart.TrimEnd()
          $notes = ($sections -join "`n`n") + "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8NoBOM -NoNewline -ErrorAction Stop

      - name: Build DFlow
        shell: pwsh
        run: |
          cargo build --locked --release --bins
          if ($LASTEXITCODE -ne 0) { throw 'Cargo release build failed.' }

      - name: Prepare the draft release with both apps and setup instructions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $executables = './target/release/dflow.exe', './target/release/dflow-dictation.exe'
          foreach ($exe in $executables) {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Missing Windows release executable $exe."
            }
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $existing = gh release view "$env:RELEASE_TAG" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) {
              throw 'A published release already exists for this tag.'
            }
            gh release upload "$env:RELEASE_TAG" @executables --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh the draft executables.' }
            gh release edit "$env:RELEASE_TAG" --notes-file "$notesFile"
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh the draft release notes.' }
          } else {
            gh release create "$env:RELEASE_TAG" @executables --title "DFlow $env:RELEASE_TAG" --notes-file "$notesFile" --verify-tag --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }
